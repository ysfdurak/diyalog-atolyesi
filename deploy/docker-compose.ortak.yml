# ysfdurak.com ortak altyapısında çalıştırma.
# Caddy (HTTPS) ortak altyapıda: github.com/ysfdurak/ysfdurak.com → sunucu/
#   cd deploy && sudo docker compose -f docker-compose.ortak.yml up -d --build
# Diyalog Atölyesi hiçbir portu dışarı açmaz; ortak Caddy "web" ağı üzerinden diyalog:8080'e ulaşır.
# Proje adı açık: Pusula ve Destek de "deploy" klasöründen çalıştığı için adsız kalırsa Docker hepsini tek proje sanar.
name: diyalog
services:
  diyalog:
    init: true  # PID 1 olarak tini: alt süreçleri toplar (zombie birikmez), sinyalleri düzgün iletir
    build: ..
    container_name: diyalog
    env_file: ../.env
    volumes:
      - diyalog-data:/data
    restart: unless-stopped
    # Sertleştirme (Kasım 2026 güvenlik taraması): kök dosya sistemi salt okunur, yazma yalnız /data ve /tmp'de;
    # Linux yetkileri kapalı, yetki yükseltme yok; bellek, süreç ve kayıt boyutu sınırlı.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true

volumes:
  diyalog-data: {}
